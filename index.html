<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>ניהול תלמידים</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #faf6f1;
            min-height: 100vh;
            padding-bottom: 100px;
            color: #5a4a3a;
        }
        
        .header {
            background: linear-gradient(135deg, #e6cdb5 0%, #dcc1a8 100%);
            color: #5a4a3a;
            padding: 20px;
            padding-top: 50px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        
        .header .subtitle {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 4px;
        }
        
        .back-btn {
            position: absolute;
            top: 50px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            display: none;
        }
        
        .back-btn.visible {
            display: block;
        }
        
        .container {
            padding: 16px;
        }
        
        /* Pinned Classes Section */
        .pinned-section {
            margin-bottom: 20px;
        }
        
        .pinned-section h2 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .pinned-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .pinned-card {
            background: linear-gradient(135deg, #e6cdb5 0%, #dcc1a8 100%);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            color: #5a4a3a;
            cursor: pointer;
            position: relative;
        }
        
        .pinned-card .unpin-btn {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(255,255,255,0.3);
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 12px;
            cursor: pointer;
        }
        
        .pinned-card .icon {
            font-size: 28px;
            margin-bottom: 6px;
        }
        
        .pinned-card .name {
            font-size: 16px;
            font-weight: 600;
        }
        
        .pinned-card .count {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .section-title {
            font-size: 14px;
            color: #666;
            margin: 20px 0 10px;
        }
        
        /* Class Cards */
        .class-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .class-card {
            background: #fffbf7;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(90,74,58,0.08);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        
        .class-card:active {
            transform: scale(0.98);
        }
        
        .class-card .pin-btn {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #f0f0f5;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
        }
        
        .class-card .pin-btn.pinned {
            background: #d4b896;
            color: white;
        }
        
        .class-card .icon {
            font-size: 40px;
            margin-bottom: 8px;
        }
        
        .class-card .name {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
        }
        
        .class-card .count {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }
        
        .add-card {
            background: #f0f0f5;
            border: 2px dashed #ccc;
            color: #666;
        }
        
        .add-card .icon {
            font-size: 32px;
        }
        
        /* Student List */
        .student-list {
            display: none;
        }
        
        .student-item {
            background: #fffbf7;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 2px 6px rgba(90,74,58,0.06);
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .student-item:active {
            transform: scale(0.98);
        }
        
        .student-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e6cdb5 0%, #dcc1a8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5a4a3a;
            font-size: 20px;
            font-weight: 600;
            flex-shrink: 0;
            overflow: hidden;
        }
        
        .student-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .student-info {
            flex: 1;
        }
        
        .student-name {
            font-size: 17px;
            font-weight: 600;
            color: #1a1a1a;
        }
        
        .student-phone {
            font-size: 13px;
            color: #666;
            margin-top: 2px;
        }
        
        .add-student-btn {
            background: linear-gradient(135deg, #d4b896 0%, #c9a989 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            position: fixed;
            bottom: 30px;
            right: 20px;
            box-shadow: 0 4px 15px rgba(180, 160, 130, 0.3);
            cursor: pointer;
            display: none;
        }
        
        #classInfoBtn {
            right: auto;
            left: 20px;
            background: linear-gradient(135deg, #b8d4b0 0%, #a5c69d 100%) !important;
            box-shadow: 0 4px 15px rgba(165, 198, 157, 0.3);
        }
        
        /* Student Profile */
        .student-profile {
            display: none;
        }
        
        .profile-header {
            text-align: center;
            padding: 20px;
            background: #fffbf7;
            border-radius: 16px;
            margin-bottom: 16px;
        }
        
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e6cdb5 0%, #dcc1a8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5a4a3a;
            font-size: 40px;
            font-weight: 600;
            margin: 0 auto 12px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }
        
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .profile-avatar .edit-photo {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.5);
            color: white;
            font-size: 11px;
            padding: 4px;
        }
        
        .profile-name {
            font-size: 24px;
            font-weight: 600;
        }
        
        .profile-class {
            color: #666;
            font-size: 14px;
        }
        
        .profile-birthday {
            color: #888;
            font-size: 13px;
            margin-top: 4px;
        }
        
        .contact-buttons {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .contact-btn {
            background: #efe8e0;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: #5a4a3a;
        }
        
        .contact-btn.call {
            background: #a8c69f;
            color: white;
        }
        
        .contact-btn.mom {
            background: #e8b4b8;
            color: white;
        }
        
        .contact-btn.dad {
            background: #7eb5d6;
            color: white;
        }
        
        .export-btn {
            background: #f0f0f5;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 12px;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            background: #fffbf7;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
            overflow-x: auto;
        }
        
        .tab {
            flex: 1;
            padding: 10px 8px;
            text-align: center;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            color: #8a7a6a;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #d4b896 0%, #c9a989 100%);
            color: #fff;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* Info Section */
        .info-card {
            background: #fffbf7;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .info-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .info-card p {
            font-size: 16px;
            color: #1a1a1a;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            color: #666;
            font-size: 14px;
        }
        
        .info-value {
            font-weight: 500;
            font-size: 14px;
        }
        
        /* Notes/Conversations */
        .note-item {
            background: #fffbf7;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
        }
        
        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        
        .note-date {
            font-size: 12px;
            color: #666;
        }
        
        .note-type-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
            background: #f0f0f5;
            color: #666;
        }
        
        .note-type-badge.discipline {
            background: #ffebee;
            color: #c62828;
        }
        
        .note-type-badge.committee {
            background: #e3f2fd;
            color: #1565c0;
        }
        
        .note-text {
            font-size: 15px;
            line-height: 1.5;
        }
        
        .add-note-btn {
            background: linear-gradient(135deg, #d4b896 0%, #c9a989 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: flex-end;
            justify-content: center;
        }
        
        .modal.open {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 40px;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-header h2 {
            font-size: 20px;
        }
        
        .modal-close {
            background: #f0f0f5;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 6px;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
        }
        
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #d4b896 0%, #c9a989 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .delete-btn {
            background: #ff3b30;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        /* Grades Table */
        .grades-table {
            width: 100%;
            background: #fffbf7;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .grades-table th,
        .grades-table td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #efe8e0;
        }
        
        .grades-table th {
            background: #f5efe8;
            font-weight: 600;
            font-size: 13px;
            color: #8a7a6a;
        }
        
        .grade-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
        }
        
        .grade-high { background: #d4edda; color: #155724; }
        .grade-mid { background: #fff3cd; color: #856404; }
        .grade-low { background: #f8d7da; color: #721c24; }
        
        /* Export Modal */
        .export-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .export-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: #f5f5f7;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .export-option input {
            width: 20px;
            height: 20px;
        }
        
        .export-option label {
            font-size: 15px;
            cursor: pointer;
        }
        
        /* Print Styles */
        @media print {
            .header, .tabs, .add-note-btn, .add-student-btn, .back-btn, .export-btn, .delete-btn, .contact-buttons, .edit-photo {
                display: none !important;
            }
            body {
                background: white;
                padding: 20px;
            }
            .modal {
                display: none !important;
            }
            .tab-content {
                display: block !important;
            }
            .profile-header {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="goBack()">→ חזרה</button>
        <h1 id="headerTitle">הכיתות שלי</h1>
        <div class="subtitle" id="headerSubtitle">בחרי כיתה להתחיל</div>
    </div>
    
    <div class="container">
        <!-- Classes View -->
        <div id="classesView">
            <div id="pinnedSection" class="pinned-section" style="display:none">
                <h2>📌 כיתות מוצמדות</h2>
                <div id="pinnedGrid" class="pinned-grid"></div>
            </div>
            <div id="allClassesSection">
                <div class="section-title" id="allClassesTitle" style="display:none">כל הכיתות</div>
                <div id="classGrid" class="class-grid"></div>
            </div>
        </div>
        
        <!-- Students List View -->
        <div id="studentsView" class="student-list">
            <!-- Students will be rendered here -->
        </div>
        
        <!-- Student Profile View -->
        <div id="profileView" class="student-profile">
            <!-- Profile will be rendered here -->
        </div>
        
        <!-- Class Profile View -->
        <div id="classProfileView" class="student-profile" style="display:none">
            <!-- Class profile will be rendered here -->
        </div>
    </div>
    
    <button class="add-student-btn" id="addStudentBtn" onclick="openAddStudentModal()">+ הוספת תלמיד/ה</button>
    <button class="add-student-btn" id="classInfoBtn" style="display:none;background:#34c759" onclick="openClassProfile()">📋 מידע על הכיתה</button>
    
    <!-- Add Class Modal -->
    <div class="modal" id="addClassModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>כיתה חדשה</h2>
                <button class="modal-close" onclick="closeModal('addClassModal')">×</button>
            </div>
            <div class="form-group">
                <label>שם הכיתה</label>
                <input type="text" id="className" placeholder="לדוגמה: ג'1">
            </div>
            <button class="submit-btn" onclick="addClass()">הוספה</button>
        </div>
    </div>
    
    <!-- Add Student Modal -->
    <div class="modal" id="addStudentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>תלמיד/ה חדש/ה</h2>
                <button class="modal-close" onclick="closeModal('addStudentModal')">×</button>
            </div>
            <div class="form-group">
                <label>שם מלא</label>
                <input type="text" id="studentName" placeholder="שם פרטי ומשפחה">
            </div>
            <div class="form-group">
                <label>תאריך לידה</label>
                <input type="date" id="studentBirthday">
            </div>
            <div class="form-group">
                <label>טלפון תלמיד/ה</label>
                <input type="tel" id="studentPhone" placeholder="050-0000000">
            </div>
            <div class="form-group">
                <label>👩 אמא</label>
                <div class="form-row">
                    <input type="text" id="momName" placeholder="שם">
                    <input type="tel" id="momPhone" placeholder="טלפון">
                </div>
            </div>
            <div class="form-group">
                <label>👨 אבא</label>
                <div class="form-row">
                    <input type="text" id="dadName" placeholder="שם">
                    <input type="tel" id="dadPhone" placeholder="טלפון">
                </div>
            </div>
            <button class="submit-btn" onclick="addStudent()">הוספה</button>
        </div>
    </div>
    
    <!-- Add Note Modal -->
    <div class="modal" id="addNoteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="noteModalTitle">הוספת רשומה</h2>
                <button class="modal-close" onclick="closeModal('addNoteModal')">×</button>
            </div>
            <div class="form-group">
                <label>סוג</label>
                <select id="noteType" onchange="toggleFileUpload()">
                    <option value="conversation">שיחה עם הורים</option>
                    <option value="discipline">אירוע משמעת</option>
                    <option value="committee">ועדה</option>
                    <option value="diagnosis">אבחון</option>
                    <option value="confidentiality">ויתור סודיות</option>
                    <option value="note">הערה כללית</option>
                    <option value="parentday">יום הורים</option>
                </select>
            </div>
            <div class="form-group">
                <label>תוכן</label>
                <textarea id="noteContent" placeholder="כתבי כאן..."></textarea>
            </div>
            <div class="form-group" id="fileUploadGroup" style="display:none">
                <label>📎 צירוף קובץ (PDF/תמונה)</label>
                <input type="file" id="noteFile" accept=".pdf,image/*" onchange="handleNoteFile(event)">
                <div id="filePreview" style="margin-top:8px;font-size:13px;color:#666;"></div>
            </div>
            <button class="submit-btn" onclick="addNote()">שמירה</button>
        </div>
    </div>
    
    <!-- Add Grade Modal -->
    <div class="modal" id="addGradeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>הוספת ציון</h2>
                <button class="modal-close" onclick="closeModal('addGradeModal')">×</button>
            </div>
            <div class="form-group">
                <label>מקצוע</label>
                <input type="text" id="gradeSubject" placeholder="לדוגמה: מתמטיקה">
            </div>
            <div class="form-group">
                <label>ציון</label>
                <input type="number" id="gradeValue" min="0" max="100" placeholder="0-100">
            </div>
            <div class="form-group">
                <label>הערה (אופציונלי)</label>
                <input type="text" id="gradeNote" placeholder="מבחן, עבודה...">
            </div>
            <button class="submit-btn" onclick="addGrade()">שמירה</button>
        </div>
    </div>
    
    <!-- Export Modal -->
    <div class="modal" id="exportModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📄 יצוא מידע</h2>
                <button class="modal-close" onclick="closeModal('exportModal')">×</button>
            </div>
            <p style="color:#666;margin-bottom:16px;">בחרי מה לכלול בפלט:</p>
            <div class="export-options">
                <div class="export-option">
                    <input type="checkbox" id="expBasic" checked>
                    <label for="expBasic">פרטים בסיסיים (שם, כיתה, ת. לידה)</label>
                </div>
                <div class="export-option">
                    <input type="checkbox" id="expParents" checked>
                    <label for="expParents">פרטי הורים</label>
                </div>
                <div class="export-option">
                    <input type="checkbox" id="expGrades" checked>
                    <label for="expGrades">ציונים</label>
                </div>
                <div class="export-option">
                    <input type="checkbox" id="expConversations">
                    <label for="expConversations">שיחות עם הורים</label>
                </div>
                <div class="export-option">
                    <input type="checkbox" id="expDiscipline">
                    <label for="expDiscipline">אירועי משמעת</label>
                </div>
                <div class="export-option">
                    <input type="checkbox" id="expCommittees">
                    <label for="expCommittees">ועדות</label>
                </div>
                <div class="export-option">
                    <input type="checkbox" id="expDiagnosis">
                    <label for="expDiagnosis">אבחונים</label>
                </div>
                <div class="export-option">
                    <input type="checkbox" id="expNotes">
                    <label for="expNotes">הערות כלליות</label>
                </div>
                <div class="export-option">
                    <input type="checkbox" id="expParentDays">
                    <label for="expParentDays">ימי הורים</label>
                </div>
            </div>
            <button class="submit-btn" onclick="exportStudent()">📄 יצוא</button>
        </div>
    </div>

    <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhotoUpload(event)">
    
    <!-- Add Class Note Modal -->
    <div class="modal" id="addClassNoteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="classNoteModalTitle">הוספת רשומה לכיתה</h2>
                <button class="modal-close" onclick="closeModal('addClassNoteModal')">×</button>
            </div>
            <div class="form-group">
                <label>סוג</label>
                <select id="classNoteType" onchange="toggleClassFileUpload()">
                    <option value="pedagogical">ועדה פדגוגית</option>
                    <option value="event">אירוע כיתה</option>
                    <option value="project">פרויקט</option>
                    <option value="note">הערה כללית</option>
                </select>
            </div>
            <div class="form-group">
                <label>כותרת</label>
                <input type="text" id="classNoteTitle" placeholder="כותרת קצרה">
            </div>
            <div class="form-group">
                <label>תוכן</label>
                <textarea id="classNoteContent" placeholder="פרטים..."></textarea>
            </div>
            <div class="form-group" id="classFileUploadGroup">
                <label>📎 צירוף קובץ (PDF/תמונה)</label>
                <input type="file" id="classNoteFile" accept=".pdf,image/*" onchange="handleClassNoteFile(event)">
                <div id="classFilePreview" style="margin-top:8px;font-size:13px;color:#666;"></div>
            </div>
            <button class="submit-btn" onclick="addClassNote()">שמירה</button>
        </div>
    </div>

    <script>
        // Data Management
        let data = JSON.parse(localStorage.getItem('teacherApp') || '{"classes":[],"students":[],"pinnedClasses":[]}');
        if (!data.pinnedClasses) data.pinnedClasses = [];
        let currentView = 'classes';
        let currentClassId = null;
        let currentStudentId = null;
        
        function saveData() {
            localStorage.setItem('teacherApp', JSON.stringify(data));
        }
        
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }
        
        // Render Functions
        function renderClasses() {
            // Render pinned classes
            const pinnedSection = document.getElementById('pinnedSection');
            const pinnedGrid = document.getElementById('pinnedGrid');
            const allClassesTitle = document.getElementById('allClassesTitle');
            
            if (data.pinnedClasses.length > 0) {
                pinnedSection.style.display = 'block';
                allClassesTitle.style.display = 'block';
                
                let pinnedHtml = '';
                data.pinnedClasses.forEach(classId => {
                    const cls = data.classes.find(c => c.id === classId);
                    if (cls) {
                        const studentCount = data.students.filter(s => s.classId === cls.id).length;
                        pinnedHtml += `
                            <div class="pinned-card" onclick="openClass('${cls.id}')">
                                <button class="unpin-btn" onclick="event.stopPropagation(); togglePin('${cls.id}')">✕</button>
                                <div class="icon">📚</div>
                                <div class="name">${cls.name}</div>
                                <div class="count">${studentCount} תלמידים</div>
                            </div>
                        `;
                    }
                });
                pinnedGrid.innerHTML = pinnedHtml;
            } else {
                pinnedSection.style.display = 'none';
                allClassesTitle.style.display = 'none';
            }
            
            // Render all classes
            const container = document.getElementById('classGrid');
            let html = '';
            
            data.classes.forEach(cls => {
                const studentCount = data.students.filter(s => s.classId === cls.id).length;
                const isPinned = data.pinnedClasses.includes(cls.id);
                html += `
                    <div class="class-card" onclick="openClass('${cls.id}')">
                        <button class="pin-btn ${isPinned ? 'pinned' : ''}" onclick="event.stopPropagation(); togglePin('${cls.id}')" title="${isPinned ? 'הסר הצמדה' : 'הצמד'}">
                            ${isPinned ? '📌' : '📍'}
                        </button>
                        <div class="icon">📚</div>
                        <div class="name">${cls.name}</div>
                        <div class="count">${studentCount} תלמידים</div>
                    </div>
                `;
            });
            
            html += `
                <div class="class-card add-card" onclick="openModal('addClassModal')">
                    <div class="icon">+</div>
                    <div class="name">כיתה חדשה</div>
                </div>
            `;
            
            container.innerHTML = html;
        }
        
        function togglePin(classId) {
            const index = data.pinnedClasses.indexOf(classId);
            if (index > -1) {
                data.pinnedClasses.splice(index, 1);
            } else {
                if (data.pinnedClasses.length >= 2) {
                    alert('ניתן להצמיד עד 2 כיתות');
                    return;
                }
                data.pinnedClasses.push(classId);
            }
            saveData();
            renderClasses();
        }
        
        function renderStudents() {
            const container = document.getElementById('studentsView');
            const students = data.students.filter(s => s.classId === currentClassId);
            
            if (students.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">👨‍🎓</div>
                        <p>אין תלמידים בכיתה זו עדיין</p>
                        <p>לחצי על "הוספת תלמיד/ה" להתחיל</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            students.sort((a, b) => a.name.localeCompare(b.name, 'he'));
            
            students.forEach(student => {
                const initials = student.name.split(' ').map(n => n[0]).join('').substring(0, 2);
                const avatarContent = student.photo 
                    ? `<img src="${student.photo}" alt="${student.name}">`
                    : initials;
                
                // Show parent phone (prefer mom, then dad)
                const parentPhone = student.momPhone || student.dadPhone || student.parentPhone || '';
                    
                html += `
                    <div class="student-item" onclick="openStudent('${student.id}')">
                        <div class="student-avatar">${avatarContent}</div>
                        <div class="student-info">
                            <div class="student-name">${student.name}</div>
                            <div class="student-phone">📱 ${parentPhone || 'אין טלפון'}</div>
                        </div>
                        <span style="color:#ccc">←</span>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function renderProfile() {
            const student = data.students.find(s => s.id === currentStudentId);
            if (!student) return;
            
            const cls = data.classes.find(c => c.id === student.classId);
            const initials = student.name.split(' ').map(n => n[0]).join('').substring(0, 2);
            const avatarContent = student.photo 
                ? `<img src="${student.photo}" alt="${student.name}">`
                : initials;
            
            const container = document.getElementById('profileView');
            
            // Format birthday
            let birthdayDisplay = '';
            if (student.birthday) {
                const bday = new Date(student.birthday);
                birthdayDisplay = bday.toLocaleDateString('he-IL');
                const age = Math.floor((new Date() - bday) / (365.25 * 24 * 60 * 60 * 1000));
                birthdayDisplay += ` (גיל ${age})`;
            }
            
            // Notes by type
            const conversations = (student.notes || []).filter(n => n.type === 'conversation');
            const diagnoses = (student.notes || []).filter(n => n.type === 'diagnosis');
            const generalNotes = (student.notes || []).filter(n => n.type === 'note');
            const parentDays = (student.notes || []).filter(n => n.type === 'parentday');
            const disciplineEvents = (student.notes || []).filter(n => n.type === 'discipline');
            const committees = (student.notes || []).filter(n => n.type === 'committee');
            const grades = student.grades || [];
            
            // Build contact buttons
            let contactButtons = '';
            if (student.phone) {
                contactButtons += `<a href="tel:${student.phone}" class="contact-btn">📱 תלמיד/ה</a>`;
            }
            if (student.momPhone) {
                const momLabel = student.momName ? `אמא - ${student.momName}` : 'אמא';
                contactButtons += `<a href="tel:${student.momPhone}" class="contact-btn mom">👩 ${momLabel}</a>`;
            }
            if (student.dadPhone) {
                const dadLabel = student.dadName ? `אבא - ${student.dadName}` : 'אבא';
                contactButtons += `<a href="tel:${student.dadPhone}" class="contact-btn dad">👨 ${dadLabel}</a>`;
            }
            // Legacy support
            if (!student.momPhone && !student.dadPhone && student.parentPhone) {
                contactButtons += `<a href="tel:${student.parentPhone}" class="contact-btn call">📞 הורים</a>`;
            }
            
            container.innerHTML = `
                <div class="profile-header">
                    <div class="profile-avatar" onclick="document.getElementById('photoInput').click()">
                        ${avatarContent}
                        <div class="edit-photo">📷 שינוי תמונה</div>
                    </div>
                    <div class="profile-name">${student.name}</div>
                    <div class="profile-class">כיתה ${cls ? cls.name : ''}</div>
                    ${birthdayDisplay ? `<div class="profile-birthday">🎂 ${birthdayDisplay}</div>` : ''}
                    <div class="contact-buttons">
                        ${contactButtons}
                    </div>
                    <button class="export-btn" onclick="openModal('exportModal')">📄 יצוא מידע</button>
                </div>
                
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('info')">פרטים</div>
                    <div class="tab" onclick="switchTab('notes')">שיחות</div>
                    <div class="tab" onclick="switchTab('grades')">ציונים</div>
                    <div class="tab" onclick="switchTab('events')">אירועים</div>
                    <div class="tab" onclick="switchTab('history')">סיכומים</div>
                    <div class="tab" onclick="switchTab('parents')">מהורים</div>
                </div>
                
                <div id="tabInfo" class="tab-content active">
                    <div class="info-card">
                        <div class="info-row">
                            <span class="info-label">טלפון תלמיד/ה</span>
                            <span class="info-value">${student.phone || 'לא הוזן'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">תאריך לידה</span>
                            <span class="info-value">${birthdayDisplay || 'לא הוזן'}</span>
                        </div>
                    </div>
                    
                    <div class="info-card">
                        <h3>👩 אמא</h3>
                        <div class="info-row">
                            <span class="info-label">שם</span>
                            <span class="info-value">${student.momName || 'לא הוזן'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">טלפון</span>
                            <span class="info-value">${student.momPhone || 'לא הוזן'}</span>
                        </div>
                    </div>
                    
                    <div class="info-card">
                        <h3>👨 אבא</h3>
                        <div class="info-row">
                            <span class="info-label">שם</span>
                            <span class="info-value">${student.dadName || 'לא הוזן'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">טלפון</span>
                            <span class="info-value">${student.dadPhone || 'לא הוזן'}</span>
                        </div>
                    </div>
                    
                    <button class="delete-btn" onclick="deleteStudent()">🗑️ מחיקת תלמיד/ה</button>
                </div>
                
                <div id="tabNotes" class="tab-content">
                    <h3 style="margin-bottom: 12px; font-size: 16px;">שיחות עם הורים</h3>
                    ${conversations.length > 0 ? conversations.map(n => `
                        <div class="note-item">
                            <div class="note-date">${n.date}</div>
                            <div class="note-text">${n.content}</div>
                        </div>
                    `).join('') : '<p style="color:#666;text-align:center;padding:20px;">אין שיחות מתועדות</p>'}
                    <button class="add-note-btn" onclick="openNoteModal('conversation')">+ תיעוד שיחה</button>
                    
                    <h3 style="margin: 24px 0 12px; font-size: 16px;">ימי הורים</h3>
                    ${parentDays.length > 0 ? parentDays.map(n => `
                        <div class="note-item">
                            <div class="note-date">${n.date}</div>
                            <div class="note-text">${n.content}</div>
                        </div>
                    `).join('') : '<p style="color:#666;text-align:center;padding:20px;">אין רשומות</p>'}
                    <button class="add-note-btn" onclick="openNoteModal('parentday')">+ תיעוד יום הורים</button>
                </div>
                
                <div id="tabGrades" class="tab-content">
                    ${grades.length > 0 ? `
                        <table class="grades-table">
                            <thead>
                                <tr>
                                    <th>מקצוע</th>
                                    <th>ציון</th>
                                    <th>הערה</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${grades.map(g => `
                                    <tr>
                                        <td>${g.subject}</td>
                                        <td><span class="grade-badge ${g.value >= 80 ? 'grade-high' : g.value >= 60 ? 'grade-mid' : 'grade-low'}">${g.value}</span></td>
                                        <td style="font-size:13px;color:#666">${g.note || ''}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    ` : '<p style="color:#666;text-align:center;padding:20px;">אין ציונים</p>'}
                    <button class="add-note-btn" onclick="openModal('addGradeModal')">+ הוספת ציון</button>
                </div>
                
                <div id="tabEvents" class="tab-content">
                    <h3 style="margin-bottom: 12px; font-size: 16px;">⚠️ אירועי משמעת</h3>
                    ${disciplineEvents.length > 0 ? disciplineEvents.map(n => `
                        <div class="note-item">
                            <div class="note-header">
                                <div class="note-date">${n.date}</div>
                                <span class="note-type-badge discipline">משמעת</span>
                            </div>
                            <div class="note-text">${n.content}</div>
                        </div>
                    `).join('') : '<p style="color:#666;text-align:center;padding:20px;">אין אירועים</p>'}
                    <button class="add-note-btn" onclick="openNoteModal('discipline')">+ תיעוד אירוע משמעת</button>
                    
                    <h3 style="margin: 24px 0 12px; font-size: 16px;">📋 ועדות</h3>
                    ${committees.length > 0 ? committees.map(n => `
                        <div class="note-item">
                            <div class="note-header">
                                <div class="note-date">${n.date}</div>
                                <span class="note-type-badge committee">ועדה</span>
                            </div>
                            <div class="note-text">${n.content}</div>
                        </div>
                    `).join('') : '<p style="color:#666;text-align:center;padding:20px;">אין ועדות</p>'}
                    <button class="add-note-btn" onclick="openNoteModal('committee')">+ תיעוד ועדה</button>
                </div>
                
                <div id="tabHistory" class="tab-content">
                    <h3 style="margin-bottom: 12px; font-size: 16px;">📋 אבחונים</h3>
                    ${diagnoses.length > 0 ? diagnoses.map(d => `
                        <div class="note-item">
                            <div class="note-header">
                                <div class="note-date">${d.date}</div>
                                <span class="note-type-badge" style="background:#e8f5e9;color:#2e7d32;">אבחון</span>
                            </div>
                            <div class="note-text">${d.content}</div>
                            ${d.file ? `
                                <div style="margin-top:10px;">
                                    <a href="${d.file}" target="_blank" download="${d.fileName || 'קובץ'}" 
                                       style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:#f0f0f5;border-radius:8px;color:#333;text-decoration:none;font-size:13px;">
                                        📎 ${d.fileName || 'צפייה בקובץ'}
                                    </a>
                                </div>
                            ` : ''}
                        </div>
                    `).join('') : '<p style="color:#666;text-align:center;padding:20px;">אין אבחונים</p>'}
                    <button class="add-note-btn" onclick="openNoteModal('diagnosis')">+ הוספת אבחון</button>
                    
                    <h3 style="margin: 24px 0 12px; font-size: 16px;">🔐 ויתורי סודיות</h3>
                    ${(student.notes || []).filter(n => n.type === 'confidentiality').length > 0 ? 
                        (student.notes || []).filter(n => n.type === 'confidentiality').map(n => `
                        <div class="note-item">
                            <div class="note-header">
                                <div class="note-date">${n.date}</div>
                                <span class="note-type-badge" style="background:#fff3e0;color:#e65100;">ויתור סודיות</span>
                            </div>
                            <div class="note-text">${n.content}</div>
                            ${n.file ? `
                                <div style="margin-top:10px;">
                                    <a href="${n.file}" target="_blank" download="${n.fileName || 'קובץ'}" 
                                       style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:#f0f0f5;border-radius:8px;color:#333;text-decoration:none;font-size:13px;">
                                        📎 ${n.fileName || 'צפייה בקובץ'}
                                    </a>
                                </div>
                            ` : ''}
                        </div>
                    `).join('') : '<p style="color:#666;text-align:center;padding:20px;">אין ויתורי סודיות</p>'}
                    <button class="add-note-btn" onclick="openNoteModal('confidentiality')">+ הוספת ויתור סודיות</button>
                    
                    <h3 style="margin: 24px 0 12px; font-size: 16px;">📝 הערות כלליות</h3>
                    ${generalNotes.length > 0 ? generalNotes.map(n => `
                        <div class="note-item">
                            <div class="note-date">${n.date}</div>
                            <div class="note-text">${n.content}</div>
                        </div>
                    `).join('') : '<p style="color:#666;text-align:center;padding:20px;">אין הערות</p>'}
                    <button class="add-note-btn" onclick="openNoteModal('note')">+ הוספת הערה</button>
                </div>
                
                <div id="tabParents" class="tab-content">
                    <h3 style="margin-bottom: 12px; font-size: 16px;">👨‍👩‍👧 מידע מהורים</h3>
                    <p style="color:#666;text-align:center;padding:10px;background:#f5f5f7;border-radius:10px;margin-bottom:15px;">
                        שלחי להורים את הלינק הבא והם יוכלו להעלות מידע חשוב
                    </p>
                    <button class="add-note-btn" onclick="generateParentLink()" style="background:#34c759;">🔗 יצירת לינק להורים</button>
                    
                    <h3 style="margin: 24px 0 12px; font-size: 16px;">📥 הגשות מהורים</h3>
                    ${(student.notes || []).filter(n => n.type === 'parent_submission').length > 0 ? 
                        (student.notes || []).filter(n => n.type === 'parent_submission').map(n => `
                        <div class="note-item" style="border-right:3px solid #34c759;">
                            <div class="note-header">
                                <div class="note-date">${n.date}</div>
                                <span class="note-type-badge" style="background:#e8f5e9;color:#2e7d32;">מהורים</span>
                            </div>
                            ${n.title ? `<div style="font-weight:600;margin-bottom:6px;">${n.title}</div>` : ''}
                            <div class="note-text">${n.content}</div>
                            ${n.file ? `
                                <div style="margin-top:10px;">
                                    <a href="${n.file}" target="_blank" download="${n.fileName || 'קובץ'}" 
                                       style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:#f0f0f5;border-radius:8px;color:#333;text-decoration:none;font-size:13px;">
                                        📎 ${n.fileName || 'צפייה בקובץ'}
                                    </a>
                                </div>
                            ` : ''}
                        </div>
                    `).join('') : '<p style="color:#666;text-align:center;padding:20px;">אין הגשות מהורים עדיין</p>'}
                </div>
            `;
        }
        
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.remove('active');
            });
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('tab' + tabName.charAt(0).toUpperCase() + tabName.slice(1)).classList.add('active');
        }
        
        // Navigation
        function openClass(classId) {
            currentClassId = classId;
            currentView = 'students';
            const cls = data.classes.find(c => c.id === classId);
            
            document.getElementById('headerTitle').textContent = 'כיתה ' + cls.name;
            document.getElementById('headerSubtitle').textContent = data.students.filter(s => s.classId === classId).length + ' תלמידים';
            document.querySelector('.back-btn').classList.add('visible');
            document.getElementById('addStudentBtn').style.display = 'block';
            document.getElementById('classInfoBtn').style.display = 'block';
            
            document.getElementById('classesView').style.display = 'none';
            document.getElementById('studentsView').style.display = 'block';
            document.getElementById('profileView').style.display = 'none';
            document.getElementById('classProfileView').style.display = 'none';
            
            renderStudents();
        }
        
        function openStudent(studentId) {
            currentStudentId = studentId;
            currentView = 'profile';
            const student = data.students.find(s => s.id === studentId);
            
            document.getElementById('headerTitle').textContent = student.name;
            document.getElementById('headerSubtitle').textContent = 'פרופיל תלמיד/ה';
            document.getElementById('addStudentBtn').style.display = 'none';
            document.getElementById('classInfoBtn').style.display = 'none';
            
            document.getElementById('classesView').style.display = 'none';
            document.getElementById('studentsView').style.display = 'none';
            document.getElementById('profileView').style.display = 'block';
            document.getElementById('classProfileView').style.display = 'none';
            
            renderProfile();
        }
        
        function goBack() {
            if (currentView === 'profile') {
                currentView = 'students';
                currentStudentId = null;
                const cls = data.classes.find(c => c.id === currentClassId);
                document.getElementById('headerTitle').textContent = 'כיתה ' + cls.name;
                document.getElementById('headerSubtitle').textContent = data.students.filter(s => s.classId === currentClassId).length + ' תלמידים';
                document.getElementById('addStudentBtn').style.display = 'block';
                document.getElementById('classInfoBtn').style.display = 'block';
                
                document.getElementById('studentsView').style.display = 'block';

        function handleNoteFile(event) {
            const file = event.target.files[0];
            if (!file) {
                pendingNoteFile = null;
                pendingNoteFileName = null;
                document.getElementById('filePreview').innerHTML = '';
                return;
            }
            
            // Check file size (max 5MB for localStorage)
            if (file.size > 5 * 1024 * 1024) {
                alert('הקובץ גדול מדי (מקסימום 5MB)');
                event.target.value = '';
                return;
            }
            
            pendingNoteFileName = file.name;
            document.getElementById('filePreview').innerHTML = `✅ ${file.name}`;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                pendingNoteFile = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function addNote() {

            if (!student) return;
            
            const content = document.getElementById('noteContent').value.trim();
            if (!content) return alert('נא להזין תוכן');
            
            if (!student.notes) student.notes = [];
            
            const noteType = document.getElementById('noteType').value;
            const newNote = {
                id: generateId(),
                type: noteType,

            };
            
            // Add file if present (for diagnosis)

            student.notes.unshift(newNote);

            pendingNoteFile = null;
            pendingNoteFileName = null;
            
            saveData();
            closeModal('addNoteModal');
            renderProfile();

        function addGrade() {
            const student = data.students.find(s => s.id === currentStudentId);
            if (!student) return;
            
            const subject = document.getElementById('gradeSubject').value.trim();
            const value = parseInt(document.getElementById('gradeValue').value);
            
            if (!subject) return alert('נא להזין מקצוע');
            if (isNaN(value) || value < 0 || value > 100) return alert('נא להזין ציון תקין (0-100)');
            
            if (!student.grades) student.grades = [];
            
            student.grades.push({

        function submitParentForm(studentId) {
            const type = document.getElementById('parentSubmitType').value;
            const content = document.getElementById('parentSubmitContent').value.trim();
            const senderName = document.getElementById('parentSubmitName').value.trim();
            const fileInput = document.getElementById('parentSubmitFile');
            
            if (!content) {
                alert('נא להזין תוכן');
                return;
            }
            
            // Create submission data
            const submission = {
                studentId: studentId,
                type: type,
                content: content,
                senderName: senderName,
                date: new Date().toLocaleDateString('he-IL'),
                timestamp: Date.now()
            };
            
            // Handle file if present
            if (fileInput.files[0]) {
                const file = fileInput.files[0];
                if (file.size > 5 * 1024 * 1024) {
                    alert('הקובץ גדול מדי (מקסימום 5MB)');
                    return;
                }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    submission.file = e.target.result;
                    submission.fileName = file.name;
                    saveParentSubmission(submission);
                };
                reader.readAsDataURL(file);
            } else {
                saveParentSubmission(submission);
            }
        }
        
        function saveParentSubmission(submission) {
            // Store in localStorage under a special key for pending submissions
            let pending = JSON.parse(localStorage.getItem('parentSubmissions') || '[]');
            pending.push(submission);
            localStorage.setItem('parentSubmissions', JSON.stringify(pending));
            
            document.body.innerHTML = `
                <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;direction:rtl;padding:20px;text-align:center;max-width:500px;margin:50px auto;">

                    <p style="color:#666;">המורה תקבל את ההודעה שלכם.</p>
                    <p style="color:#888;font-size:14px;margin-top:30px;">ניתן לסגור דף זה</p>
                </div>
            `;
        }
        
        function loadParentSubmissions() {
            // Load pending submissions and add them to students
            let pending = JSON.parse(localStorage.getItem('parentSubmissions') || '[]');
            if (pending.length === 0) return;
            
            let added = 0;
            pending.forEach(sub => {
                const student = data.students.find(s => s.id === sub.studentId);
                if (student) {
                    if (!student.notes) student.notes = [];
                    // Check if already added (by timestamp)
                    if (!student.notes.find(n => n.timestamp === sub.timestamp)) {
                        student.notes.unshift({
                            id: generateId(),
                            type: 'parent_submission',
                            title: sub.type + (sub.senderName ? ' (מ: ' + sub.senderName + ')' : ''),
                            content: sub.content,
                            date: sub.date,
                            timestamp: sub.timestamp,
                            file: sub.file,
                            fileName: sub.fileName
                        });
                        added++;
                    }
                }
            });
            
            if (added > 0) {
                saveData();
                // Clear processed submissions
                localStorage.removeItem('parentSubmissions');
            }
        }

                </div>
                
                <div id="classTabPedagogical" class="tab-content active">
                    <h3 style="margin-bottom: 12px; font-size: 16px;">📋 ועדות פדגוגיות</h3>
                    ${pedagogical.length > 0 ? pedagogical.map(n => renderClassNote(n)).join('') : '<p style="color:#666;text-align:center;padding:20px;">אין ועדות</p>'}
                    <button class="add-note-btn" onclick="openClassNoteModal('pedagogical')">+ הוספת ועדה</button>
                </div>
                
                <div id="classTabEvents" class="tab-content">
                    <h3 style="margin-bottom: 12px; font-size: 16px;">🎉 אירועי כיתה</h3>
                    ${events.length > 0 ? events.map(n => renderClassNote(n)).join('') : '<p style="color:#666;text-align:center;padding:20px;">אין אירועים</p>'}
                    <button class="add-note-btn" onclick="openClassNoteModal('event')">+ הוספת אירוע</button>
                </div>
                
                <div id="classTabProjects" class="tab-content">
                    <h3 style="margin-bottom: 12px; font-size: 16px;">🎯 פרויקטים</h3>
                    ${projects.length > 0 ? projects.map(n => renderClassNote(n)).join('') : '<p style="color:#666;text-align:center;padding:20px;">אין פרויקטים</p>'}
                    <button class="add-note-btn" onclick="openClassNoteModal('project')">+ הוספת פרויקט</button>
                </div>
                
                <div id="classTabNotes" class="tab-content">
                    <h3 style="margin-bottom: 12px; font-size: 16px;">📝 הערות כלליות</h3>
                    ${generalNotes.length > 0 ? generalNotes.map(n => renderClassNote(n)).join('') : '<p style="color:#666;text-align:center;padding:20px;">אין הערות</p>'}
                    <button class="add-note-btn" onclick="openClassNoteModal('note')">+ הוספת הערה</button>
                </div>
            `;
        }
        
        function renderClassNote(n) {
            const typeLabels = {
                'pedagogical': { label: 'ועדה', color: '#1565c0', bg: '#e3f2fd' },
                'event': { label: 'אירוע', color: '#7b1fa2', bg: '#f3e5f5' },
                'project': { label: 'פרויקט', color: '#2e7d32', bg: '#e8f5e9' },
                'note': { label: 'הערה', color: '#666', bg: '#f5f5f5' }
            };
            const style = typeLabels[n.type] || typeLabels['note'];
            
            return `
                <div class="note-item">
                    <div class="note-header">
                        <div class="note-date">${n.date}</div>
                        <span class="note-type-badge" style="background:${style.bg};color:${style.color};">${style.label}</span>
                    </div>
                    ${n.title ? `<div style="font-weight:600;margin-bottom:6px;">${n.title}</div>` : ''}
                    <div class="note-text">${n.content}</div>
                    ${n.file ? `
                        <div style="margin-top:10px;">
                            <a href="${n.file}" target="_blank" download="${n.fileName || 'קובץ'}" 
                               style="display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:#f0f0f5;border-radius:8px;color:#333;text-decoration:none;font-size:13px;">
                                📎 ${n.fileName || 'צפייה בקובץ'}
                            </a>
                        </div>
                    ` : ''}
                </div>
            `;
        }
        
        function switchClassTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            const tabId = 'classTab' + tabName.charAt(0).toUpperCase() + tabName.slice(1);
            document.getElementById(tabId).classList.add('active');
        }
        
        function openClassNoteModal(type) {
            document.getElementById('classNoteType').value = type;
            document.getElementById('classNoteTitle').value = '';
            document.getElementById('classNoteContent').value = '';
            document.getElementById('classNoteFile').value = '';
            document.getElementById('classFilePreview').innerHTML = '';
            pendingClassFile = null;
            pendingClassFileName = null;
            
            const titles = {
                'pedagogical': 'הוספת ועדה פדגוגית',
                'event': 'הוספת אירוע כיתה',
                'project': 'הוספת פרויקט',
                'note': 'הוספת הערה'
            };
            document.getElementById('classNoteModalTitle').textContent = titles[type];
            openModal('addClassNoteModal');
        }
        
        function toggleClassFileUpload() {
            // File upload always visible for class notes
        }
        
        function handleClassNoteFile(event) {
            const file = event.target.files[0];
            if (!file) {
                pendingClassFile = null;
                pendingClassFileName = null;
                document.getElementById('classFilePreview').innerHTML = '';
                return;
            }
            
            if (file.size > 5 * 1024 * 1024) {
                alert('הקובץ גדול מדי (מקסימום 5MB)');
                event.target.value = '';
                return;
            }
            
            pendingClassFileName = file.name;
            document.getElementById('classFilePreview').innerHTML = `✅ ${file.name}`;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                pendingClassFile = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        function addClassNote() {
            const cls = data.classes.find(c => c.id === currentClassId);
            if (!cls) return;
            
            const content = document.getElementById('classNoteContent').value.trim();
            if (!content) return alert('נא להזין תוכן');
            
            if (!cls.notes) cls.notes = [];
            
            const newNote = {
                id: generateId(),
                type: document.getElementById('classNoteType').value,
                title: document.getElementById('classNoteTitle').value.trim(),
                content: content,
                date: new Date().toLocaleDateString('he-IL')
            };
            
            if (pendingClassFile) {
                newNote.file = pendingClassFile;
                newNote.fileName = pendingClassFileName;
            }
            
            cls.notes.unshift(newNote);
            
            pendingClassFile = null;
            pendingClassFileName = null;
            
            saveData();
            closeModal('addClassNoteModal');
            renderClassProfile();
        }
        
        // Initialize
        if (!checkParentMode()) {
            loadParentSubmissions();
            renderClasses();
        }
    </script>
</body>
</html>
