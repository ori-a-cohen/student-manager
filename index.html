<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>ניהול תלמידים</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            padding-bottom: 100px;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            padding-top: 50px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        
        .header .subtitle {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 4px;
        }
        
        .back-btn {
            position: absolute;
            top: 50px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            display: none;
        }
        
        .back-btn.visible {
            display: block;
        }
        
        .container {
            padding: 16px;
        }
        
        /* Class Cards */
        .class-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .class-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .class-card:active {
            transform: scale(0.98);
        }
        
        .class-card .icon {
            font-size: 40px;
            margin-bottom: 8px;
        }
        
        .class-card .name {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
        }
        
        .class-card .count {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }
        
        .add-card {
            background: #f0f0f5;
            border: 2px dashed #ccc;
            color: #666;
        }
        
        .add-card .icon {
            font-size: 32px;
        }
        
        /* Student List */
        .student-list {
            display: none;
        }
        
        .student-item {
            background: white;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .student-item:active {
            transform: scale(0.98);
        }
        
        .student-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 600;
            flex-shrink: 0;
            overflow: hidden;
        }
        
        .student-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .student-info {
            flex: 1;
        }
        
        .student-name {
            font-size: 17px;
            font-weight: 600;
            color: #1a1a1a;
        }
        
        .student-phone {
            font-size: 13px;
            color: #666;
            margin-top: 2px;
        }
        
        .add-student-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            cursor: pointer;
            display: none;
        }
        
        /* Student Profile */
        .student-profile {
            display: none;
        }
        
        .profile-header {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 16px;
            margin-bottom: 16px;
        }
        
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
            font-weight: 600;
            margin: 0 auto 12px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }
        
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .profile-avatar .edit-photo {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.5);
            color: white;
            font-size: 11px;
            padding: 4px;
        }
        
        .profile-name {
            font-size: 24px;
            font-weight: 600;
        }
        
        .profile-class {
            color: #666;
            font-size: 14px;
        }
        
        .contact-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            justify-content: center;
        }
        
        .contact-btn {
            background: #f0f0f5;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .contact-btn.call {
            background: #34c759;
            color: white;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            background: white;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
        }
        
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* Info Section */
        .info-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .info-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .info-card p {
            font-size: 16px;
            color: #1a1a1a;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            color: #666;
            font-size: 14px;
        }
        
        .info-value {
            font-weight: 500;
            font-size: 14px;
        }
        
        /* Notes/Conversations */
        .note-item {
            background: white;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
        }
        
        .note-date {
            font-size: 12px;
            color: #666;
            margin-bottom: 6px;
        }
        
        .note-text {
            font-size: 15px;
            line-height: 1.5;
        }
        
        .add-note-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: flex-end;
            justify-content: center;
        }
        
        .modal.open {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 40px;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-header h2 {
            font-size: 20px;
        }
        
        .modal-close {
            background: #f0f0f5;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 6px;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
        }
        
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .delete-btn {
            background: #ff3b30;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        /* Grades Table */
        .grades-table {
            width: 100%;
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }
        
        .grades-table th,
        .grades-table td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .grades-table th {
            background: #f5f5f7;
            font-weight: 600;
            font-size: 13px;
            color: #666;
        }
        
        .grade-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
        }
        
        .grade-high { background: #d4edda; color: #155724; }
        .grade-mid { background: #fff3cd; color: #856404; }
        .grade-low { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="goBack()">→ חזרה</button>
        <h1 id="headerTitle">הכיתות שלי</h1>
        <div class="subtitle" id="headerSubtitle">בחרי כיתה להתחיל</div>
    </div>
    
    <div class="container">
        <!-- Classes View -->
        <div id="classesView" class="class-grid">
            <!-- Classes will be rendered here -->
        </div>
        
        <!-- Students List View -->
        <div id="studentsView" class="student-list">
            <!-- Students will be rendered here -->
        </div>
        
        <!-- Student Profile View -->
        <div id="profileView" class="student-profile">
            <!-- Profile will be rendered here -->
        </div>
    </div>
    
    <button class="add-student-btn" id="addStudentBtn" onclick="openAddStudentModal()">+ הוספת תלמיד/ה</button>
    
    <!-- Add Class Modal -->
    <div class="modal" id="addClassModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>כיתה חדשה</h2>
                <button class="modal-close" onclick="closeModal('addClassModal')">×</button>
            </div>
            <div class="form-group">
                <label>שם הכיתה</label>
                <input type="text" id="className" placeholder="לדוגמה: ג'1">
            </div>
            <button class="submit-btn" onclick="addClass()">הוספה</button>
        </div>
    </div>
    
    <!-- Add Student Modal -->
    <div class="modal" id="addStudentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>תלמיד/ה חדש/ה</h2>
                <button class="modal-close" onclick="closeModal('addStudentModal')">×</button>
            </div>
            <div class="form-group">
                <label>שם מלא</label>
                <input type="text" id="studentName" placeholder="שם פרטי ומשפחה">
            </div>
            <div class="form-group">
                <label>טלפון תלמיד/ה</label>
                <input type="tel" id="studentPhone" placeholder="050-0000000">
            </div>
            <div class="form-group">
                <label>טלפון הורים</label>
                <input type="tel" id="parentPhone" placeholder="050-0000000">
            </div>
            <button class="submit-btn" onclick="addStudent()">הוספה</button>
        </div>
    </div>
    
    <!-- Add Note Modal -->
    <div class="modal" id="addNoteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="noteModalTitle">הוספת רשומה</h2>
                <button class="modal-close" onclick="closeModal('addNoteModal')">×</button>
            </div>
            <div class="form-group">
                <label>סוג</label>
                <select id="noteType">
                    <option value="conversation">שיחה עם הורים</option>
                    <option value="diagnosis">אבחון</option>
                    <option value="note">הערה כללית</option>
                    <option value="parentday">יום הורים</option>
                </select>
            </div>
            <div class="form-group">
                <label>תוכן</label>
                <textarea id="noteContent" placeholder="כתבי כאן..."></textarea>
            </div>
            <button class="submit-btn" onclick="addNote()">שמירה</button>
        </div>
    </div>
    
    <!-- Add Grade Modal -->
    <div class="modal" id="addGradeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>הוספת ציון</h2>
                <button class="modal-close" onclick="closeModal('addGradeModal')">×</button>
            </div>
            <div class="form-group">
                <label>מקצוע</label>
                <input type="text" id="gradeSubject" placeholder="לדוגמה: מתמטיקה">
            </div>
            <div class="form-group">
                <label>ציון</label>
                <input type="number" id="gradeValue" min="0" max="100" placeholder="0-100">
            </div>
            <div class="form-group">
                <label>הערה (אופציונלי)</label>
                <input type="text" id="gradeNote" placeholder="מבחן, עבודה...">
            </div>
            <button class="submit-btn" onclick="addGrade()">שמירה</button>
        </div>
    </div>

    <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhotoUpload(event)">

    <script>
        // Data Management
        let data = JSON.parse(localStorage.getItem('teacherApp') || '{"classes":[],"students":[]}');
        let currentView = 'classes';
        let currentClassId = null;
        let currentStudentId = null;
        
        function saveData() {
            localStorage.setItem('teacherApp', JSON.stringify(data));
        }
        
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }
        
        // Render Functions
        function renderClasses() {
            const container = document.getElementById('classesView');
            let html = '';
            
            data.classes.forEach(cls => {
                const studentCount = data.students.filter(s => s.classId === cls.id).length;
                html += `
                    <div class="class-card" onclick="openClass('${cls.id}')">
                        <div class="icon">📚</div>
                        <div class="name">${cls.name}</div>
                        <div class="count">${studentCount} תלמידים</div>
                    </div>
                `;
            });
            
            html += `
                <div class="class-card add-card" onclick="openModal('addClassModal')">
                    <div class="icon">+</div>
                    <div class="name">כיתה חדשה</div>
                </div>
            `;
            
            container.innerHTML = html;
        }
        
        function renderStudents() {
            const container = document.getElementById('studentsView');
            const students = data.students.filter(s => s.classId === currentClassId);
            
            if (students.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">👨‍🎓</div>
                        <p>אין תלמידים בכיתה זו עדיין</p>
                        <p>לחצי על "הוספת תלמיד/ה" להתחיל</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            students.sort((a, b) => a.name.localeCompare(b.name, 'he'));
            
            students.forEach(student => {
                const initials = student.name.split(' ').map(n => n[0]).join('').substring(0, 2);
                const avatarContent = student.photo 
                    ? `<img src="${student.photo}" alt="${student.name}">`
                    : initials;
                    
                html += `
                    <div class="student-item" onclick="openStudent('${student.id}')">
                        <div class="student-avatar">${avatarContent}</div>
                        <div class="student-info">
                            <div class="student-name">${student.name}</div>
                            <div class="student-phone">📱 ${student.parentPhone || 'אין טלפון'}</div>
                        </div>
                        <span style="color:#ccc">←</span>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function renderProfile() {
            const student = data.students.find(s => s.id === currentStudentId);
            if (!student) return;
            
            const cls = data.classes.find(c => c.id === student.classId);
            const initials = student.name.split(' ').map(n => n[0]).join('').substring(0, 2);
            const avatarContent = student.photo 
                ? `<img src="${student.photo}" alt="${student.name}">`
                : initials;
            
            const container = document.getElementById('profileView');
            
            // Notes by type
            const conversations = (student.notes || []).filter(n => n.type === 'conversation');
            const diagnoses = (student.notes || []).filter(n => n.type === 'diagnosis');
            const generalNotes = (student.notes || []).filter(n => n.type === 'note');
            const parentDays = (student.notes || []).filter(n => n.type === 'parentday');
            const grades = student.grades || [];
            
            container.innerHTML = `
                <div class="profile-header">
                    <div class="profile-avatar" onclick="document.getElementById('photoInput').click()">
                        ${avatarContent}
                        <div class="edit-photo">📷 שינוי תמונה</div>
                    </div>
                    <div class="profile-name">${student.name}</div>
                    <div class="profile-class">כיתה ${cls ? cls.name : ''}</div>
                    <div class="contact-buttons">
                        ${student.phone ? `<a href="tel:${student.phone}" class="contact-btn">📱 תלמיד/ה</a>` : ''}
                        ${student.parentPhone ? `<a href="tel:${student.parentPhone}" class="contact-btn call">📞 הורים</a>` : ''}
                    </div>
                </div>
                
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('info')">פרטים</div>
                    <div class="tab" onclick="switchTab('notes')">שיחות</div>
                    <div class="tab" onclick="switchTab('grades')">ציונים</div>
                    <div class="tab" onclick="switchTab('history')">היסטוריה</div>
                </div>
                
                <div id="tabInfo" class="tab-content active">
                    <div class="info-card">
                        <div class="info-row">
                            <span class="info-label">טלפון תלמיד/ה</span>
                            <span class="info-value">${student.phone || 'לא הוזן'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">טלפון הורים</span>
                            <span class="info-value">${student.parentPhone || 'לא הוזן'}</span>
                        </div>
                    </div>
                    
                    ${diagnoses.length > 0 ? `
                        <h3 style="margin: 16px 0 8px; font-size: 16px;">אבחונים</h3>
                        ${diagnoses.map(d => `
                            <div class="note-item">
                                <div class="note-date">${d.date}</div>
                                <div class="note-text">${d.content}</div>
                            </div>
                        `).join('')}
                    ` : ''}
                    
                    <button class="add-note-btn" onclick="openNoteModal('diagnosis')">+ הוספת אבחון</button>
                    <button class="delete-btn" onclick="deleteStudent()">🗑️ מחיקת תלמיד/ה</button>
                </div>
                
                <div id="tabNotes" class="tab-content">
                    <h3 style="margin-bottom: 12px; font-size: 16px;">שיחות עם הורים</h3>
                    ${conversations.length > 0 ? conversations.map(n => `
                        <div class="note-item">
                            <div class="note-date">${n.date}</div>
                            <div class="note-text">${n.content}</div>
                        </div>
                    `).join('') : '<p style="color:#666;text-align:center;padding:20px;">אין שיחות מתועדות</p>'}
                    <button class="add-note-btn" onclick="openNoteModal('conversation')">+ תיעוד שיחה</button>
                    
                    <h3 style="margin: 24px 0 12px; font-size: 16px;">ימי הורים</h3>
                    ${parentDays.length > 0 ? parentDays.map(n => `
                        <div class="note-item">
                            <div class="note-date">${n.date}</div>
                            <div class="note-text">${n.content}</div>
                        </div>
                    `).join('') : '<p style="color:#666;text-align:center;padding:20px;">אין רשומות</p>'}
                    <button class="add-note-btn" onclick="openNoteModal('parentday')">+ תיעוד יום הורים</button>
                </div>
                
                <div id="tabGrades" class="tab-content">
                    ${grades.length > 0 ? `
                        <table class="grades-table">
                            <thead>
                                <tr>
                                    <th>מקצוע</th>
                                    <th>ציון</th>
                                    <th>הערה</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${grades.map(g => `
                                    <tr>
                                        <td>${g.subject}</td>
                                        <td><span class="grade-badge ${g.value >= 80 ? 'grade-high' : g.value >= 60 ? 'grade-mid' : 'grade-low'}">${g.value}</span></td>
                                        <td style="font-size:13px;color:#666">${g.note || ''}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    ` : '<p style="color:#666;text-align:center;padding:20px;">אין ציונים</p>'}
                    <button class="add-note-btn" onclick="openModal('addGradeModal')">+ הוספת ציון</button>
                </div>
                
                <div id="tabHistory" class="tab-content">
                    <h3 style="margin-bottom: 12px; font-size: 16px;">כל ההערות</h3>
                    ${generalNotes.length > 0 ? generalNotes.map(n => `
                        <div class="note-item">
                            <div class="note-date">${n.date}</div>
                            <div class="note-text">${n.content}</div>
                        </div>
                    `).join('') : '<p style="color:#666;text-align:center;padding:20px;">אין הערות</p>'}
                    <button class="add-note-btn" onclick="openNoteModal('note')">+ הוספת הערה</button>
                </div>
            `;
        }
        
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.remove('active');
            });
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('tab' + tabName.charAt(0).toUpperCase() + tabName.slice(1)).classList.add('active');
        }
        
        // Navigation
        function openClass(classId) {
            currentClassId = classId;
            currentView = 'students';
            const cls = data.classes.find(c => c.id === classId);
            
            document.getElementById('headerTitle').textContent = 'כיתה ' + cls.name;
            document.getElementById('headerSubtitle').textContent = data.students.filter(s => s.classId === classId).length + ' תלמידים';
            document.querySelector('.back-btn').classList.add('visible');
            document.getElementById('addStudentBtn').style.display = 'block';
            
            document.getElementById('classesView').style.display = 'none';
            document.getElementById('studentsView').style.display = 'block';
            document.getElementById('profileView').style.display = 'none';
            
            renderStudents();
        }
        
        function openStudent(studentId) {
            currentStudentId = studentId;
            currentView = 'profile';
            const student = data.students.find(s => s.id === studentId);
            
            document.getElementById('headerTitle').textContent = student.name;
            document.getElementById('headerSubtitle').textContent = 'פרופיל תלמיד/ה';
            document.getElementById('addStudentBtn').style.display = 'none';
            
            document.getElementById('classesView').style.display = 'none';
            document.getElementById('studentsView').style.display = 'none';
            document.getElementById('profileView').style.display = 'block';
            
            renderProfile();
        }
        
        function goBack() {
            if (currentView === 'profile') {
                currentView = 'students';
                currentStudentId = null;
                const cls = data.classes.find(c => c.id === currentClassId);
                document.getElementById('headerTitle').textContent = 'כיתה ' + cls.name;
                document.getElementById('headerSubtitle').textContent = data.students.filter(s => s.classId === currentClassId).length + ' תלמידים';
                document.getElementById('addStudentBtn').style.display = 'block';
                
                document.getElementById('studentsView').style.display = 'block';
                document.getElementById('profileView').style.display = 'none';
            } else if (currentView === 'students') {
                currentView = 'classes';
                currentClassId = null;
                document.getElementById('headerTitle').textContent = 'הכיתות שלי';
                document.getElementById('headerSubtitle').textContent = 'בחרי כיתה להתחיל';
                document.querySelector('.back-btn').classList.remove('visible');
                document.getElementById('addStudentBtn').style.display = 'none';
                
                document.getElementById('classesView').style.display = 'grid';
                document.getElementById('studentsView').style.display = 'none';
            }
        }
        
        // Modal Functions
        function openModal(modalId) {
            document.getElementById(modalId).classList.add('open');
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('open');
        }
        
        function openAddStudentModal() {
            document.getElementById('studentName').value = '';
            document.getElementById('studentPhone').value = '';
            document.getElementById('parentPhone').value = '';
            openModal('addStudentModal');
        }
        
        function openNoteModal(type) {
            document.getElementById('noteType').value = type;
            document.getElementById('noteContent').value = '';
            const titles = {
                'conversation': 'תיעוד שיחה עם הורים',
                'diagnosis': 'הוספת אבחון',
                'note': 'הוספת הערה',
                'parentday': 'תיעוד יום הורים'
            };
            document.getElementById('noteModalTitle').textContent = titles[type];
            openModal('addNoteModal');
        }
        
        // CRUD Functions
        function addClass() {
            const name = document.getElementById('className').value.trim();
            if (!name) return alert('נא להזין שם כיתה');
            
            data.classes.push({
                id: generateId(),
                name: name
            });
            
            saveData();
            closeModal('addClassModal');
            document.getElementById('className').value = '';
            renderClasses();
        }
        
        function addStudent() {
            const name = document.getElementById('studentName').value.trim();
            if (!name) return alert('נא להזין שם');
            
            data.students.push({
                id: generateId(),
                classId: currentClassId,
                name: name,
                phone: document.getElementById('studentPhone').value.trim(),
                parentPhone: document.getElementById('parentPhone').value.trim(),
                notes: [],
                grades: []
            });
            
            saveData();
            closeModal('addStudentModal');
            renderStudents();
            
            // Update subtitle
            document.getElementById('headerSubtitle').textContent = data.students.filter(s => s.classId === currentClassId).length + ' תלמידים';
        }
        
        function addNote() {
            const student = data.students.find(s => s.id === currentStudentId);
            if (!student) return;
            
            const content = document.getElementById('noteContent').value.trim();
            if (!content) return alert('נא להזין תוכן');
            
            if (!student.notes) student.notes = [];
            
            student.notes.unshift({
                id: generateId(),
                type: document.getElementById('noteType').value,
                content: content,
                date: new Date().toLocaleDateString('he-IL')
            });
            
            saveData();
            closeModal('addNoteModal');
            renderProfile();
        }
        
        function addGrade() {
            const student = data.students.find(s => s.id === currentStudentId);
            if (!student) return;
            
            const subject = document.getElementById('gradeSubject').value.trim();
            const value = parseInt(document.getElementById('gradeValue').value);
            
            if (!subject) return alert('נא להזין מקצוע');
            if (isNaN(value) || value < 0 || value > 100) return alert('נא להזין ציון תקין (0-100)');
            
            if (!student.grades) student.grades = [];
            
            student.grades.push({
                id: generateId(),
                subject: subject,
                value: value,
                note: document.getElementById('gradeNote').value.trim(),
                date: new Date().toLocaleDateString('he-IL')
            });
            
            saveData();
            closeModal('addGradeModal');
            document.getElementById('gradeSubject').value = '';
            document.getElementById('gradeValue').value = '';
            document.getElementById('gradeNote').value = '';
            renderProfile();
        }
        
        function deleteStudent() {
            if (!confirm('האם למחוק את התלמיד/ה? פעולה זו לא ניתנת לביטול.')) return;
            
            data.students = data.students.filter(s => s.id !== currentStudentId);
            saveData();
            goBack();
        }
        
        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const student = data.students.find(s => s.id === currentStudentId);
                if (student) {
                    student.photo = e.target.result;
                    saveData();
                    renderProfile();
                }
            };
            reader.readAsDataURL(file);
        }
        
        // Initialize
        renderClasses();
    </script>
</body>
</html>
